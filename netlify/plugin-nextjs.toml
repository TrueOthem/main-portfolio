# Configuration for the Netlify Next.js plugin
[build]
  # Set the command to build your Next.js app
  command = "bun run build"
  
  # Set the directory to publish
  publish = ".next/standalone"

[build.environment]
  # Set the Node.js version
  NODE_VERSION = "20"
  
  # Set the Next.js runtime
  NEXT_RUNTIME = "nodejs"

[functions]
  # Set the directory where your Netlify functions are located
  directory = "netlify/functions"

# Configure the Next.js plugin
[[plugins]]
  package = "@netlify/plugin-nextjs"

  [plugins.inputs]
    # Set the timeout for static page generation (in seconds)
    staticPageGenerationTimeout = 300
    
    # If you're using internationalized routing
    trailingSlash = false
